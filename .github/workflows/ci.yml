# FieldShift CI — backend (Alembic + pytest against real PostGIS) + frontend.
#
# Backend: the suite needs a real PostgreSQL + PostGIS (no SQLite fallback).
# A postgis/postgis:16-3.5 service container is published on host port 5433
# (the port tests/conftest.py and alembic expect), database fieldshift_test.
# Migration 0001 issues CREATE EXTENSION IF NOT EXISTS postgis, which the
# image's superuser role satisfies.
#
# Frontend: dependency install, a NON-BLOCKING TypeScript check
# (continue-on-error: true — next.config.ts currently sets
# typescript.ignoreBuildErrors: true, so type errors must not fail CI yet),
# and `bun run lint` (eslint .). `bun run build` is deliberately NOT run in
# CI; production images are built via the Dockerfiles.

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (pytest + alembic on PostGIS 16-3.5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-services/fieldshift-api
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fieldshift_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s
    env:
      # tests/conftest.py reads FIELDSHIFT_TEST_DB_URL (its default targets
      # the passwordless sandbox cluster; CI must authenticate with a
      # password). Host/port stay 127.0.0.1:5433 as the suite expects.
      FIELDSHIFT_TEST_DB_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5433/fieldshift_test
      # alembic env.py reads settings.database_url (FIELDSHIFT_ prefix).
      FIELDSHIFT_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5433/fieldshift_test
      # conftest's bootstrap connections (CREATE DATABASE / EXTENSION) use
      # libpq and pick up PGPASSWORD.
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      # Python 3.12 matches the sandbox runtime (CPython 3.12.16) and the
      # pinned requirements (all 48 deps ship cp312 manylinux wheels).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-services/fieldshift-api/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations to head
        run: alembic upgrade head

      - name: Run test suite
        run: pytest -q

  frontend:
    name: frontend (tsc check + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Non-blocking TypeScript check: the build currently sets
      # typescript.ignoreBuildErrors: true in next.config.ts, so this is
      # informational until the codebase is type-clean.
      - name: Type check (non-blocking)
        continue-on-error: true
        run: bunx tsc --noEmit

      # package.json defines "lint": "eslint ." — keep in sync if renamed.
      - name: Lint
        run: bun run lint
