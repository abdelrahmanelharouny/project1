# CropTwist CI — reproducible quality gate.
#
# backend: Alembic migrations + full pytest against a real PostGIS 16-3.5
#   service container (the suite has no SQLite fallback), then an API-level
#   deterministic rules-only E2E of uvicorn + scripts/e2e_smoke.py. Provider
#   transport/failover/stream/schema behavior is verified by mocked Python
#   tests; live LLM connectivity is a separate credential-gated release check.
# frontend: dependency install (frozen lockfile), BLOCKING TypeScript check
#   (next.config.ts sets typescript.ignoreBuildErrors: false since P0 — type
#   errors fail the build too), ESLint, frontend regression tests, and a production `next build`.
#   `bunx tsc --noEmit` at the repo root validates ONLY the frontend src/
#   project (tsconfig.json excludes mini-services/ and skills/).
# bridge: strict TypeScript check for the LLM bridge package
#   (mini-services/llm-bridge owns its own tsconfig + @types/bun).

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (pytest + alembic + E2E on PostGIS 16-3.5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini-services/fieldshift-api
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: croptwist_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s
    env:
      # tests/conftest.py reads CROPTWIST_TEST_DB_URL (its default targets
      # the passwordless sandbox cluster; CI must authenticate with a
      # password). Host/port stay 127.0.0.1:5433 as the suite expects.
      CROPTWIST_TEST_DB_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5433/croptwist_test
      # alembic env.py reads settings.database_url (CROPTWIST_ prefix).
      CROPTWIST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5433/croptwist_test
      # conftest's bootstrap connections (CREATE DATABASE / EXTENSION) use
      # libpq and pick up PGPASSWORD.
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      # Python 3.12 matches the sandbox runtime (CPython 3.12.x) and the
      # pinned requirements (all deps ship cp312 manylinux wheels).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mini-services/fieldshift-api/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations to head
        run: alembic upgrade head

      - name: Verify migrations are idempotent at head + no model drift
        run: |
          alembic upgrade head  # second run must be a no-op
          alembic current
          alembic check  # fails if models drift from migrations (P0 fix)

      - name: Run test suite
        run: pytest -q

      # ---------------- credential-independent runtime E2E ----------------
      - name: Seed demo workspace
        run: |
          python -c "from app.core.database import SessionLocal; \
                     from app.dev.seed import ensure_demo_workspace; \
                     db = SessionLocal(); ensure_demo_workspace(db); \
                     db.commit(); db.close()"

      - name: Start rules-only API, wait for health
        run: |
          # This is the isolated CI API: dev mode auto-verifies synthetic E2E
          # registrations because this job intentionally configures no SMTP.
          mkdir -p /tmp/croptwist-ci-reports
          CROPTWIST_DEV_MODE=true CROPTWIST_LLM_ENABLED=false \
            CROPTWIST_REPORTS_DIR=/tmp/croptwist-ci-reports nohup python -m uvicorn app.main:app \
            --host 127.0.0.1 --port 3030 > /tmp/api-ci.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://127.0.0.1:3030/api/v1/health >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fs http://127.0.0.1:3030/api/v1/health

      - name: E2E smoke (login → insights → recommendations → advisor)
        run: python scripts/e2e_smoke.py --expect-rules-only

  frontend:
    name: frontend (tsc + eslint + tests + build) + bridge typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # BLOCKING: repo-root tsconfig.json scopes this to the frontend src/
      # project (mini-services/ and skills/ are excluded). The build also
      # type-checks (typescript.ignoreBuildErrors: false in next.config.ts).
      - name: Type check (blocking)
        run: bunx tsc --noEmit

      # package.json defines "lint": "eslint ." — keep in sync if renamed.
      - name: Lint
        run: bun run lint

      - name: Frontend regression tests
        run: bun test tests/frontend

      # Production build (includes its own type check + page data collection).
      - name: Production build
        run: bun run build

      # The LLM bridge is an independent bun package with its own tsconfig
      # and @types/bun — typecheck it in isolation.
      - name: Install llm-bridge dependencies
        working-directory: mini-services/llm-bridge
        run: bun install --frozen-lockfile

      - name: Bridge type check
        working-directory: mini-services/llm-bridge
        run: ../../node_modules/.bin/tsc --noEmit
