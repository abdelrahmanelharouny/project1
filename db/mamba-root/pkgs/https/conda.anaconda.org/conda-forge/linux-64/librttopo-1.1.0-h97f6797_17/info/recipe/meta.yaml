about:
  description: "The RT Topology Library exposes an API to create and manage standard\
    \ (ISO\n13249 aka SQL/MM) topologies using user-provided data stores and released\n\
    under the GNU GPL license (version 2 or later).\n\nThe code is derived from PostGIS\
    \ liblwgeom library enhanced to provide\nthread-safety, have less dependencies\
    \ and be independent from PostGIS\nrelease cycles.\n\nThe RT Topology Library\
    \ was funded by \u201CRegione Toscana - SITA\u201D (CIG:\n6445512CC1), which also\
    \ funded many improvements in the originating\nliblwgeom.\n"
